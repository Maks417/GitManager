appId: com.gitmanager.app
productName: Git Manager
copyright: Copyright © Git Manager
directories:
  output: release
  buildResources: build
files:
  - out/**/*
  - package.json
extraResources:
  - from: build/icon.png
    to: icon.png
  - from: build/icon.ico
    to: icon.ico
# No spaces: GitHub turns them into dots on upload, which broke the mac zip's blockmap name
# (Git.Manager-…) that latest-mac.yml refers to.
artifactName: Git-Manager-${version}-${os}-${arch}.${ext}
asar: true
asarUnpack:
  - "**/*.node"
publish:
  provider: github
  owner: Maks417
  repo: GitManager
  # Each platform job uploads to a draft; the release workflow publishes it after all succeed.
  releaseType: draft
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
        - arm64
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
mac:
  icon: build/icon.icns
  target:
    # Apple Silicon only; zip is the payload electron-updater downloads on macOS.
    - target: dmg
      arch:
        - arm64
    - target: zip
      arch:
        - arm64
  category: public.app-category.developer-tools
  hardenedRuntime: true
  gatekeeperAssess: false
linux:
  icon: build/icon.png
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
  category: Development
  # Required by the deb target (package.json author has no email).
  maintainer: Maks417 <Maks417@users.noreply.github.com>
  synopsis: Cross-platform Git repository manager
