name: Pages

on:
  push:
    branches: [master]
    paths:
      - site/**
      - docs/assets/screenshots/**
      - build/icon.svg
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a deploy halfway; a newer push queues behind it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      # The page reuses the README screenshots and the app icon instead of keeping copies in site/.
      - name: Add shared assets
        run: |
          mkdir -p site/assets/screenshots
          cp docs/assets/screenshots/*.png site/assets/screenshots/
          cp build/icon.svg site/assets/icon.svg

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v5
