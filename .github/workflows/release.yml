name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-release:
    # A manual run must target a tag, so it can never publish an arbitrary branch.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches package.json version
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi

      # Create the draft once up front: parallel electron-builder jobs racing to create it
      # can leave duplicate drafts. `gh release list` includes drafts, `gh release view <tag>` doesn't.
      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          existing="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName \
            --jq ".[] | select(.tagName == \"$GITHUB_REF_NAME\") | .tagName")"
          if [ -z "$existing" ]; then
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --draft --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
          fi

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
          # macos-latest is an Apple Silicon runner; the app ships arm64-only.
          - os: macos-latest
            platform: mac
          - os: ubuntu-latest
            platform: linux
    runs-on: ${{ matrix.os }}
    # Linux is optional: its failure must not block publishing Windows and macOS.
    continue-on-error: ${{ matrix.platform == 'linux' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck, lint & unit tests
        run: npm run typecheck && npm run lint && npm test

      # Uploads to the draft release created above (releaseType: draft in electron-builder.yml).
      # Certificates are per platform: electron-builder falls back to CSC_LINK on Windows,
      # so a macOS .p12 must never reach the Windows job.
      - name: Build & upload to draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ matrix.platform == 'mac' && secrets.MAC_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.platform == 'mac' && secrets.MAC_CSC_KEY_PASSWORD || '' }}
          APPLE_ID: ${{ matrix.platform == 'mac' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ matrix.platform == 'mac' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ matrix.platform == 'mac' && secrets.APPLE_TEAM_ID || '' }}
          WIN_CSC_LINK: ${{ matrix.platform == 'win' && secrets.WIN_CSC_LINK || '' }}
          WIN_CSC_KEY_PASSWORD: ${{ matrix.platform == 'win' && secrets.WIN_CSC_KEY_PASSWORD || '' }}
        run: |
          args=(--${{ matrix.platform }} --publish always)
          if [ "${{ matrix.platform }}" = mac ] && [ -z "$CSC_LINK" ]; then
            # No Developer ID yet: ad-hoc sign, otherwise Apple Silicon refuses the modified bundle.
            # Not notarized and can't auto-update; users open it once via right-click → Open.
            args+=(-c.mac.identity=- -c.mac.hardenedRuntime=false)
          fi
          npm run build
          npx electron-builder "${args[@]}"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.platform }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb
            release/*.blockmap
            release/latest*.yml

  publish:
    # Make the release public only once every platform uploaded its installers and update feed,
    # so auto-update never sees a release without its latest.yml / latest-mac.yml.
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Publish draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
